assumptions:
- id: A-PAPER-1
  text: All Wordle players are Twitter users, and all Twitter users are potential
    Wordle players.
  scope: paper
  label: Assumption 1
  referenced_by: []
- id: A-MODEL-1
  text: TPers do TP everyday, and non-TPers never do TP.
  scope: model
  label: Consistency of Behavior
  justification: Defines the compartment transition semantics of PCQL.
  referenced_by: []
- id: A-MODEL-2
  text: Non-TPers transformed from TPers will never become TPers again.
  scope: model
  label: No Return
  referenced_by: []
