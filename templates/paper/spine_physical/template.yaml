  - order: 110
    kind: report_on_ai
    title: Report on Use of AI
    enabled: true
    tier: mandatory
  problem_type_note: 机理类题目：推导要完整到读者能复现，数值格式必须做收敛性验证。只给结果不给验证是这类题最常见的失分点。
purpose_cn: 机理/物理题的章节顺序：守恒律、模型推导、数值格式与验证。
