template_id: fig.dumbbell
kind: figure
version: 1.0.0
purpose: Compare one quantity between two points in time or two scenarios with a connecting segment.
observed_in: a compact alternative to grouped bars in policy and evaluation papers; the corpus uses paired bar charts instead
evidence:
- '2021 C/2107052: supplier indicator before and after policy intervention, shown as two adjacent bar series'
- '2020 A/2001334: 2015-versus-2020 regional values listed in a two-column table'
- 'corpus: improvement/deterioration comparisons recur in evaluation sub-problems, always as paired columns'
backend: matplotlib
figure_type: scatter
requires:
  model: false
  dataset: false
  required_inputs:
  - categories
  - before
  - after
inputs:
- name: categories
  role: labels
  type: array
  optional: false
  description: 各对比对象名称
- name: before
  role: reference
  type: array
  optional: false
  description: 第一个时点/方案的数值，长度等于 categories
- name: after
  role: metric
  type: array
  optional: false
  description: 第二个时点/方案的数值，长度等于 categories
- name: before_label
  role: label
  type: scalar
  optional: true
  description: 第一端图例名，如"改造前"
- name: after_label
  role: label
  type: scalar
  optional: true
  description: 第二端图例名，如"改造后"
outputs:
- name: figure
  type: file
  role: artifact
  description: Vector PDF bound to ResultAtoms
- name: figure_record
  type: any
  role: metadata
  description: A populated Figure record
caption_template: Change in {x_label} between the two configurations.
defaults:
  format: pdf
  width_in: 6.0
latex: \includegraphics[width=0.8\linewidth]{{{file}}}
purpose_cn: 两个时点或两种方案的数值对比，连线一眼看出增减。
