template_id: fig.boxplot_grouped
kind: figure
version: 1.0.0
purpose: Compare distributions across groups, annotating the median difference.
observed_in: 8 of 237 modern papers; 5 of them C
evidence:
- '2023 C/2300348: ''the Median difference of the box plot for rep was 0.13004, while pos was only 0.05973'''
backend: matplotlib
figure_type: boxplot
requires:
  model: false
  dataset: false
  required_inputs:
  - groups
  - values
  - median_annotation
inputs:
- name: groups
  role: labels
  type: array
  optional: false
- name: values
  role: distribution
  type: array
  optional: false
- name: median_annotation
  role: annotation
  type: scalar
  optional: true
outputs:
- name: figure
  type: file
  role: artifact
  description: Vector PDF bound to ResultAtoms
- name: figure_record
  type: any
  role: metadata
  description: A populated Figure record
caption_template: Distribution of {metric_label} by {group_label}.
defaults:
  format: pdf
  width_in: 6.0
latex: \includegraphics[width=0.8\linewidth]{{{file}}}
purpose_cn: 分组箱线图，并标出组间中位数差异。
