template_id: fig.bump_chart
kind: figure
version: 1.0.0
purpose: Track how the rank of several entities changes across periods, with connecting lines.
observed_in: the canonical figure of ranking papers; absent from the corpus, which reports rank changes as tables of numbers
evidence:
- 'corpus: 0/155 Outstanding papers draw a rank-evolution figure, while ranking problems appear in evaluation and sports sub-problems'
- '2022 C/2200401: portfolio holdings ranked each trading day, reported only as a holdings table'
- '2023 B/2305312: site ranking recomputed under each scenario, shown as three separate ranking columns'
backend: matplotlib
figure_type: line
requires:
  model: false
  dataset: false
  required_inputs:
  - entities
  - periods
  - ranks
inputs:
- name: entities
  role: labels
  type: array
  optional: false
  description: 被排名的对象名称，个数等于 ranks 的行数
- name: periods
  role: independent_variable
  type: array
  optional: false
  description: 时期名（如年份、轮次），个数等于 ranks 的列数
- name: ranks
  role: matrix
  type: matrix
  optional: false
  description: 每个对象在每个时期的名次，第 r 行第 c 列是对象 r 在时期 c 的名次（1 为最好）
outputs:
- name: figure
  type: file
  role: artifact
  description: Vector PDF bound to ResultAtoms
- name: figure_record
  type: any
  role: metadata
  description: A populated Figure record
caption_template: Rank evolution of {n_entities} entities over {n_periods} periods.
defaults:
  format: pdf
  width_in: 6.6
latex: \includegraphics[width=0.95\linewidth]{{{file}}}
purpose_cn: 多个对象在若干时期的名次变化，连线看谁在上升谁在掉队。
