template_id: fig.residual_hist_qq
kind: figure
version: 1.0.0
purpose: Two-panel residual diagnostic — histogram of residuals beside a normal Q-Q plot.
observed_in: the diagnostic pair recommended for every regression fit; the corpus has histograms and Q-Q plots only in isolation
evidence:
- '2023 C/2309397 section 5.4 ''Error Analysis'': residual spread discussed without a Q-Q plot'
- '2020 A/2001334 Figure 16: pairwise RMSE combined into a Q-Q plot, no residual histogram alongside'
- 'corpus: fig.histogram_distribution (2.2%) and fig.qq_plot (1.8%) occur, but never as one diagnostic panel'
backend: matplotlib
figure_type: histogram
requires:
  model: false
  dataset: false
  required_inputs:
  - residual
inputs:
- name: residual
  role: residual
  type: array
  optional: false
  description: 残差序列（观测值减预测值），至少 3 个点才能看出分布形状
- name: bins
  role: parameter
  type: scalar
  optional: true
  description: 直方图的分箱数，缺省按样本量自动确定
outputs:
- name: figure
  type: file
  role: artifact
  description: Vector PDF bound to ResultAtoms
- name: figure_record
  type: any
  role: metadata
  description: A populated Figure record
caption_template: Residual diagnostics for the {model_label} fit.
defaults:
  format: pdf
  width_in: 6.6
latex: \includegraphics[width=0.95\linewidth]{{{file}}}
purpose_cn: 残差诊断组合图：左边看分布形状，右边看是否偏离正态。
