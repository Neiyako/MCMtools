template_id: fig.correlation_heatmap
kind: figure
version: 1.0.0
purpose: Show which variables move together, with the sign of every correlation readable at a glance.
observed_in: 7.1% of Outstanding papers contain a heat map, and it is the default multi-variable view
evidence:
- 'corpus: 11/155 Outstanding papers contain a heat map; correlation matrices are the most common use'
- '2023 C/2300348 Fig 5: correlation matrix of the nine questionnaire items'
- '2022 C/2200401 Fig 2: cross-correlation heat map of the candidate predictors'
backend: matplotlib
figure_type: heatmap
requires:
  model: false
  dataset: false
  required_inputs:
  - labels
  - matrix
inputs:
- name: labels
  role: labels
  type: array
  optional: false
- name: matrix
  role: matrix
  type: array
  optional: false
- name: lower_only
  role: parameter
  type: scalar
  optional: true
outputs:
- name: figure
  type: file
  role: artifact
  description: Vector PDF bound to ResultAtoms
- name: figure_record
  type: any
  role: metadata
  description: A populated Figure record
caption_template: Correlation matrix of {x_label} ({n} variables).
defaults:
  format: pdf
  width_in: 6.4
latex: \includegraphics[width=0.85\linewidth]{{{file}}}
purpose_cn: 看哪些变量一起变化，带正负号 —— 单色渐变分不清正相关和负相关。
