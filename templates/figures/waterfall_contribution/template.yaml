template_id: fig.waterfall_contribution
kind: figure
version: 1.0.0
purpose: Decompose the change of a total into the signed contribution of each factor.
observed_in: the natural companion to sensitivity analysis; corpus papers show factor effects as a bar
  chart with no base and no total
evidence:
- 'corpus: sensitivity is the second most common analysis, drawn as tornado or grouped bars in ~5% of
  papers'
- '2023 B/2301794: factor contributions to total cost listed as a table of deltas'
- '2024 A/2400996 Fig 7: single-factor perturbations reported one bar per factor, without a cumulative
  total'
backend: matplotlib
figure_type: bar
requires:
  model: false
  dataset: false
  required_inputs:
  - labels
  - values
inputs:
- name: labels
  role: labels
  type: array
  optional: false
- name: values
  role: contribution
  type: array
  optional: false
- name: base
  role: reference_value
  type: scalar
  optional: true
- name: total_label
  role: label
  type: scalar
  optional: true
outputs:
- name: figure
  type: file
  role: artifact
  description: Vector PDF bound to ResultAtoms
- name: figure_record
  type: any
  role: metadata
  description: A populated Figure record
caption_template: Contribution of each factor to the change in {y_label}.
defaults:
  format: pdf
  width_in: 6.6
latex: \includegraphics[width=0.95\linewidth]{{{file}}}
purpose_cn: 把总量的变化拆成各因素的正负贡献。
